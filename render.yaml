services:
  # Main web service
  - type: web
    name: influencer-fantasy-league
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_URL
        sync: false
      - key: NEXT_PUBLIC_FRAME_NAME
        value: Influencer Fantasy League
      - key: NEYNAR_API_KEY
        sync: false
      - key: NEYNAR_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_NEYNAR_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: KV_REST_API_URL
        sync: false
      - key: KV_REST_API_TOKEN
        sync: false

  # Cron job for score updates (runs every 15 minutes on free tier!)
  - type: cron
    name: update-scores-cron
    env: node
    schedule: "*/15 * * * *"
    buildCommand: npm install
    startCommand: node -e "fetch('https://influencer-fantasy-league.onrender.com/api/cron/update-scores', {method:'POST',headers:{'Authorization':'Bearer ' + process.env.CRON_SECRET}}).then(r=>r.json()).then(console.log)"
    envVars:
      - key: CRON_SECRET
        sync: false

